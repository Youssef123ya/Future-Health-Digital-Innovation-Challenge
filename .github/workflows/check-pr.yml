# Checks every pull request before it reaches main: the type-check and production build the Pages deploy runs
# (npm run build), then the test suite, which the deploy does not run. Build before tests, so a failing test
# never hides whether the app still builds.
name: Check pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npx vite build

      - name: Unit and integration tests
        run: npm test
