# Checks every pull request before it reaches main: the type-check and production build the Pages deploy runs
# (npm run build), then the test suite, which the deploy does not run. Build before tests, so a failing test
# never hides whether the app still builds.
name: Check pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npx vite build

      # The simulator speed test times 30 workers × a full shift against a 3 s target with 1.5× tolerance. Run beside
      # the other test files, it competes with them for the runner's cores (best 3.5 s and 4.9 s on two runs of the
      # same code); run alone it took 2.0 s. So it runs in its own step, after the rest of the suite.
      - name: Unit and integration tests
        run: npx vitest run --testNamePattern '^(?!.*within the 3 s target)'

      - name: Simulator speed (run alone)
        run: npx vitest run src/sim/worldsim.test.ts --testNamePattern 'within the 3 s target'
